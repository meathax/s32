name: build-rbf

# Compiles the Sega System 32 core to SegaS32.rbf and uploads it as an
# artifact only after fit, timing, freshness, and RBF qualification pass.
#
# Quartus is large and its license/container availability varies; this
# workflow uses a community Quartus 17.0 image. If it is unavailable
# for your fork, either:
#   - switch `container.image` to another Quartus 17.0.x Standard image, or
#   - move this job to a self-hosted runner with Quartus installed and drop
#     the Docker steps (the compile command itself is unchanged).

on:
  push:
    branches: ["**"]
    tags: ["v*"]          # tagging vX.Y.Z publishes a GitHub Release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quartus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Quartus 17.0 image is larger than the free space left on a stock
      # hosted runner. Reclaim only preinstalled SDKs on this disposable VM,
      # before Docker pulls the image. Running the job itself in the container
      # would pull it before any cleanup step could execute.
      - name: Reclaim runner disk for Quartus
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force
          echo "Disk after cleanup:"
          df -h /

      - name: Pull Quartus 17.0 image
        run: docker pull raetro/quartus:17.0

      - name: Build and qualify RBF
        run: |
          docker run --rm \
            --workdir /build \
            --volume "$GITHUB_WORKSPACE:/build" \
            raetro/quartus:17.0 \
            bash tools/build.sh

      - name: Upload RBF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SegaS32-rbf
          path: releases/SegaS32.rbf
          if-no-files-found: error

      - name: Upload fit/timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports
          path: |
            output_files/*.rpt
            output_files/*.summary
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quartus
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download qualified RBF
        uses: actions/download-artifact@v4
        with:
          name: SegaS32-rbf
          path: releases

      - name: Publish RBF to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: releases/SegaS32.rbf
          fail_on_unmatched_files: true
          body: |
            Sega System 32 / Multi 32 MiSTer core — `SegaS32.rbf`.
            Built by CI from ${{ github.sha }}. Installation instructions are in `README.md`.
