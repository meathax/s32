name: build-rbf

# Compiles the Sega System 32 core to SegaS32.rbf and uploads it as an
# artifact. See docs/BUILD.md.
#
# Quartus is large and its license/container availability varies; this
# workflow uses a community Quartus 17.0 image. If it is unavailable
# for your fork, either:
#   - switch `container.image` to another Quartus 17.0.x Standard image, or
#   - move this job to a self-hosted runner with Quartus installed and drop
#     the Docker steps (the compile command itself is unchanged).

on:
  push:
    branches: ["**"]
    tags: ["v*"]          # tagging vX.Y.Z publishes a GitHub Release
  workflow_dispatch:

permissions:
  contents: write          # required to create Releases

jobs:
  quartus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Quartus 17.0 image is larger than the free space left on a stock
      # hosted runner. Reclaim only preinstalled SDKs on this disposable VM,
      # before Docker pulls the image. Running the job itself in the container
      # would pull it before any cleanup step could execute.
      - name: Reclaim runner disk for Quartus
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force
          echo "Disk after cleanup:"
          df -h /

      - name: Pull Quartus 17.0 image
        run: docker pull raetro/quartus:17.0

      - name: Generate PLL and compile
        run: |
          docker run --rm \
            --workdir /build \
            --volume "$GITHUB_WORKSPACE:/build" \
            raetro/quartus:17.0 \
            bash -c '
              qsys-script --script=tools/make_pll.tcl &&
              qsys-generate rtl/pll/pll.qsys --synthesis=VERILOG \
                --output-directory=rtl/pll &&
              test -f rtl/pll/synthesis/pll.qip &&
              quartus_sh --flow compile Arcade-SegaSystem32
            '
          test -f output_files/Arcade-SegaSystem32.rbf

      - name: Stage RBF under the MRA name
        run: |
          mkdir -p releases
          cp output_files/Arcade-SegaSystem32.rbf releases/SegaS32.rbf

      - name: Upload RBF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SegaS32-rbf
          path: releases/SegaS32.rbf
          if-no-files-found: error

      - name: Upload fit/timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports
          path: |
            output_files/*.rpt
            output_files/*.summary
          if-no-files-found: ignore

      # On a version tag (vX.Y.Z), publish the freshly built RBF as a
      # GitHub Release asset so it lands under the repo's Releases page.
      - name: Publish RBF to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/SegaS32.rbf
          fail_on_unmatched_files: true
          body: |
            Sega System 32 / Multi 32 MiSTer core — `SegaS32.rbf`.
            Built by CI from ${{ github.sha }}.
            Install per docs/BUILD.md; MRAs live in `mra/`.
